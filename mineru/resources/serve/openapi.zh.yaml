      - id
      - bytes
      - created_at
      - expires_at
      - filename
      - mime_type
      - status
      title: UploadResponse
      description: An upload session, and the File object once it is complete.
    UrlSource:
      properties:
        type:
          type: string
          const: url
          title: Type
          description: 选择 url 来源变体。
          default: url
        url:
          type: string
          title: Url
          description: 服务端在解析前下载的 HTTP(S) URL。
      additionalProperties: false
      type: object
      required:
      - url
      title: UrlSource
      description: Let the server fetch the document itself.
    UsageBillingPeriod:
      properties:
        start:
          type: string
          title: Start
          description: 当前计费周期开始的 ISO-8601 UTC 时间。
        end:
          anyOf:
          - type: string
          - type: 'null'
          title: End
          description: 本周期结束的 ISO-8601 UTC 时间；未结束时为 null。
      additionalProperties: false
      type: object
      required:
      - start
      title: UsageBillingPeriod
      description: Window the usage counters cover.
    UsageCurrent:
      properties:
        pages_processed:
          type: integer
          title: Pages Processed
          description: 本周期已解析的页数。
          default: 0
        files_processed:
          type: integer
          title: Files Processed
          description: 本周期已解析的文件数。
          default: 0
        jobs_created:
          type: integer
          title: Jobs Created
          description: 本周期已提交的任务数。
          default: 0
      additionalProperties: false
      type: object
      title: UsageCurrent
      description: What this server has processed in the current period.
    UsageLimits:
      properties:
        max_pages_per_file:
          type: integer
          title: Max Pages Per File
          description: 单个文档的页数上限。
          default: 1000
        max_file_size_bytes:
          type: integer
          title: Max File Size Bytes
          description: 单个上传文件的大小上限。
          default: 209715200
        max_files_per_job:
          type: integer
          title: Max Files Per Job
          description: 单个任务的文档数上限。
          default: 100
        max_concurrent_jobs:
          type: integer
          title: Max Concurrent Jobs
          description: 本服务同时运行的任务数。
          default: 1
        max_file_retention_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max File Retention Days
          description: 产物保留天数；null 表示不限。
      additionalProperties: false
      type: object
      title: UsageLimits
      description: What this server accepts per request.
    UsageResponse:
      properties:
        object:
          type: string
          const: usage
          title: Object
          description: 对象类型；恒为 "usage"。
          default: usage
        access_level:
          type: string
          enum:
          - anonymous
          - registered
          title: Access Level
          description: 本次调用方是否已鉴权。
        billing_period:
          $ref: '#/components/schemas/UsageBillingPeriod'
          description: 计数覆盖的时间窗口。
        current:
          $ref: '#/components/schemas/UsageCurrent'
          description: 当前周期内的计数。
        limits:
          $ref: '#/components/schemas/UsageLimits'
          description: 对新请求应用的限额。
      additionalProperties: false
      type: object
      required:
      - access_level
      - billing_period
      - current
      - limits
      title: UsageResponse
      description: Current usage and the limits it is measured against.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Bearer API key when configured
      scheme: bearer
tags:
- name: Tasks
  description: 一次请求完成解析、异步任务，以及内联或 ZIP 结果。
- name: Health
  description: 存活与服务就绪状态。
- name: Tiers
  description: 本服务公布的解析等级与运行时能力。
- name: Models
  description: 可用于解析的 VLM 模型。
- name: Uploads
  description: 为源文档创建与管理上传会话。
- name: Files
  description: 查看已上传的文件并获取解析内容。
- name: Jobs
  description: 提交解析任务并轮询结果。
- name: Usage
  description: 远程服务配额与用量报告。
servers:
- url: SERVER_URL
  description: API Server
