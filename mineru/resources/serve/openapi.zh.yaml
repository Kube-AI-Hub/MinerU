          \ YOUR_TOKEN\",\n}\nresponse = requests.get(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/tasks/{task_id}\";\n\nconst response = await fetch(url, {\n  method: \"GET\"\
          ,\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await response.json();\nconsole.log(response.status,\
          \ data);"
      - lang: shell
        label: cURL
        source: "curl -X GET 'SERVER_URL/v1/tasks/{task_id}' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
    delete:
      tags:
      - Tasks
      summary: 取消任务
      description: 通过已有的后台取消机制取消任务。
      operationId: cancel_task_v1_tasks__task_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          description: Task ID (job_...)
          examples:
          - job_1324359f69a657f22b833071
          title: Task Id
        description: 任务 ID（job_...）
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/tasks/{task_id}\"\nheaders = {\n    \"Authorization\": \"Bearer\
          \ YOUR_TOKEN\",\n}\nresponse = requests.delete(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/tasks/{task_id}\";\n\nconst response = await fetch(url, {\n  method: \"DELETE\"\
          ,\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await response.json();\nconsole.log(response.status,\
          \ data);"
      - lang: shell
        label: cURL
        source: "curl -X DELETE 'SERVER_URL/v1/tasks/{task_id}' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
  /v1/tasks/{task_id}/result:
    get:
      tags:
      - Tasks
      summary: 获取结果
      description: 按任务终态返回内联 JSON 或产物压缩包。
      operationId: get_result_v1_tasks__task_id__result_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          description: Task ID (job_...)
          examples:
          - job_1324359f69a657f22b833071
          title: Task Id
        description: 任务 ID（job_...）
      - name: response_format
        in: query
        required: false
        schema:
          enum:
          - json
          - zip
          type: string
          description: 'Result shape: "json" inlines the content, "zip" returns the artifact archive.'
          examples:
          - json
          default: json
          title: Response Format
        description: 结果形态："json" 内联内容，"zip" 返回产物压缩包。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultResponse'
            application/zip:
              schema:
                type: string
                format: binary
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
          description: Accepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/tasks/{task_id}/result?response_format=json\"\nheaders = {\n   \
          \ \"Authorization\": \"Bearer YOUR_TOKEN\",\n}\nresponse = requests.get(url, headers=headers)\n\nprint(response.status_code)\n\
          print(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/tasks/{task_id}/result?response_format=json\";\n\nconst response = await fetch(url,\
          \ {\n  method: \"GET\",\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await\
          \ response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X GET 'SERVER_URL/v1/tasks/{task_id}/result?response_format=json' \\\n  -H \"Authorization: Bearer\
          \ YOUR_TOKEN\""
  /v1/file_parse:
    post:
      tags:
      - Tasks
      summary: 文件解析
      description: 同步包装共享异步任务；等待超时不会取消后台工作。
      operationId: file_parse_v1_file_parse_post
      security:
      - HTTPBearer: []
      parameters:
      - name: response_format
        in: query
        required: false
        schema:
          enum:
          - json
          - zip
          type: string
          description: 'Result shape: "json" inlines the content, "zip" returns the artifact archive.'
          examples:
          - json
          default: json
          title: Response Format
        description: 结果形态："json" 内联内容，"zip" 返回产物压缩包。
      - name: wait_timeout
        in: query
        required: false
        schema:
          type: integer
          maximum: 3600
          minimum: 1
          description: Seconds to wait for the job before returning its current status; the job keeps running.
          examples:
          - 300
          default: 300
          title: Wait Timeout
        description: 等待任务完成的秒数；超时后返回当前状态，任务继续执行。
      - name: tier
        in: query
        required: false
        description: 质量档位：flash、basic、standard 或 advanced。省略则使用服务端默认值。
        schema:
          anyOf:
          - enum:
            - flash
            - basic
            - standard
            - advanced
            type: string
          - type: 'null'
          examples:
          - standard
          title: Tier
      - name: ocr_mode
        in: query
        required: false
        description: OCR 模式：自动判断、仅用文本层，或强制 OCR。
        schema:
          default: auto
          enum:
          - auto
          - txt
          - ocr
          examples:
          - auto
          title: Ocr Mode
          type: string
      - name: page_range
        in: query
        required: false
        description: PDF 页码选择：1 起始的闭区间，例如 '1-5,8,r3-r1'；'r1' 表示最后一页，'all' 表示全部页面。留空表示不指定。选择会排序去重，越界页会被忽略。反向区间、'~' 与负数页码无效。
        schema:
          default: ''
          examples:
          - 1-5,8,r3-r1
          - all
          title: Page Range
          type: string
      - name: output_formats
        in: query
        required: false
        description: 要产出的产物：markdown、middle_json、structured_content、zip。
        schema:
          examples:
          - - markdown
            - structured_content
          items:
            type: string
          title: Output Formats
          type: array
      - name: filename
        in: query
        required: false
        description: 仅原始字节上传：文件名，其后缀决定使用哪个解析器。
        schema:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          examples:
          - document.pdf
          title: Filename
      - name: sha256sum
        in: query
        required: false
        description: 仅原始字节上传：小写十六进制 SHA-256，相同的字节可被复用。
        schema:
          anyOf:
          - pattern: ^[a-f0-9]{64}$
            type: string
          - type: 'null'
          examples:
          - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          title: Sha256Sum
      - name: Content-Length
        in: header
        required: false
        description: application/octet-stream 必填；必须与实际文件字节数一致。
        schema:
          type: integer
          minimum: 1
          maximum: 209715200
          examples:
          - 1048576
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultResponse'
            application/zip:
              schema:
                type: string
                format: binary
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
          description: Accepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: 要解析的文档。三种方式任选：带 `files` 字段的 multipart/form-data；单个原始文件用 application/octet-stream（配合查询参数）；或带 CreateJobRequest
          主体的 application/json。
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                  description: One or more documents to parse, in order.
          application/json:
            schema:
              additionalProperties: false
              description: Submit documents for parsing.
              properties:
                files:
                  description: Documents to parse, in order.
                  items:
                    additionalProperties: false
                    description: One document to parse, with an optional page selection.
                    properties:
                      source:
                        description: Where the document comes from; `type` selects the source variant.
                        discriminator:
                          propertyName: type
                        oneOf:
                        - additionalProperties: false
                          description: Reference bytes that were uploaded earlier.
                          properties:
                            type:
                              const: file_id
                              default: file_id
                              description: Selects the file_id source variant.
                              title: Type
                              type: string
                            file_id:
                              description: ID of a completed upload's File object.
                              title: File Id
                              type: string
                          required:
                          - file_id
                          title: FileIdSource
                          type: object
                        - additionalProperties: false
                          description: Let the server fetch the document itself.
                          properties:
                            type:
                              const: url
                              default: url
                              description: Selects the url source variant.
                              title: Type
                              type: string
                            url:
                              description: HTTP(S) URL the server downloads before parsing.
                              title: Url
                              type: string
                          required:
                          - url
                          title: UrlSource
                          type: object
                        - additionalProperties: false
                          description: Carry the document in the request body as base64.
                          properties:
                            type:
                              const: inline
                              default: inline
                              description: Selects the inline source variant.
                              title: Type
                              type: string
                            name:
                              description: File name for the inline content; the suffix selects the parser.
                              minLength: 1
                              title: Name
                              type: string
                            data:
                              description: Base64-encoded file content.
                              minLength: 1
                              title: Data
                              type: string
                          required:
                          - name
                          - data
                          title: InlineSource
                          type: object
                        - additionalProperties: false
                          description: Read a path on the server's own filesystem.
                          properties:
                            type:
                              const: local
                              default: local
                              description: Selects the local source variant.
                              title: Type
                              type: string
                            path:
                              description: Path on the server; only accepted when local sources are enabled.
                              minLength: 1
                              title: Path
                              type: string
                          required:
                          - path
                          title: LocalSource
                          type: object
                        title: Source
                      page_range:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: 'PDF page selection: 1-based inclusive ranges, e.g. ''1-5,8,r3-r1''; ''r1'' is the last
                          page and ''all'' selects every page. Blank means unspecified. Selections are sorted and deduplicated;
                          out-of-bounds pages are omitted. Reversed ranges, ''~'' and negative page numbers are invalid.'
                        examples:
                        - 1-5,8,r3-r1
                        - all
                        title: Page Range
                    required:
                    - source
                    title: JobFileEntry
                    type: object
                  maxItems: 100
                  minItems: 1
                  title: Files
                  type: array
                tier:
                  anyOf:
                  - enum:
                    - flash
                    - basic
                    - standard
                    - advanced
                    type: string
                  - type: 'null'
                  description: 'Quality tier: flash, basic, standard or advanced. Omit to use the server''s default.'
                  examples:
                  - standard
                  title: Tier
                ocr_mode:
                  default: auto
                  description: 'OCR mode for this parse job: auto-detect, native text, or forced OCR.'
                  enum:
                  - auto
                  - txt
                  - ocr
                  examples:
                  - auto
                  title: Ocr Mode
                  type: string
                output_formats:
                  default:
                  - markdown
                  description: 'Artifacts to produce: markdown, middle_json, structured_content, zip.'
                  examples:
                  - - markdown
                    - middle_json
                  items:
                    type: string
                  title: Output Formats
                  type: array
                callback:
                  anyOf:
                  - additionalProperties: false
                    description: Where to deliver a webhook when the job reaches a terminal state.
                    properties:
                      url:
                        description: HTTP(S) URL the server posts the finished job to.
                        title: Url
                        type: string
                      secret:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Shared secret used to sign the callback.
                        title: Secret
                    required:
                    - url
                    title: CallbackConfig
                    type: object
                  - type: 'null'
                  description: Webhook to call when the job finishes; local servers reject it.
              required:
              - files
              title: CreateJobRequest
              type: object
          application/octet-stream:
            schema:
              type: string
              format: binary
            description: Raw file bytes; `filename` is required as a query parameter.
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/file_parse?response_format=json&wait_timeout=300&tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content\"\
          \nheaders = {\n    \"Authorization\": \"Bearer YOUR_TOKEN\",\n}\nfiles = {\"files\": (\"document.pdf\", open(\"\
          document.pdf\", \"rb\"), \"application/pdf\")}\n\nresponse = requests.post(url, files=files, headers=headers)\n\n\
          print(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/file_parse?response_format=json&wait_timeout=300&tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content\"\
          ;\nconst form = new FormData();\nform.append(\"files\", fileInput.files[0], \"document.pdf\");\n\nconst response\
          \ = await fetch(url, {\n  method: \"POST\",\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n  body:\
          \ form,\n});\n\nconst data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X POST 'SERVER_URL/v1/file_parse?response_format=json&wait_timeout=300&tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content'\
          \ \\\n  -H \"Authorization: Bearer YOUR_TOKEN\" \\\n  -F \"files=@document.pdf\""
components:
  schemas:
    CallbackConfig:
      properties:
        url:
          type: string
          title: Url
          description: 任务完成后服务端回调的 HTTP(S) URL。
        secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret
          description: 用于签名的回调共享密钥。
      additionalProperties: false
      type: object
      required:
      - url
      title: CallbackConfig
      description: Where to deliver a webhook when the job reaches a terminal state.
    CompleteUploadRequest:
      properties:
        sha256sum:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          title: Sha256Sum
          description: 已上传字节的小写十六进制 SHA-256；不匹配则拒绝该上传。
      additionalProperties: false
      type: object
      title: CompleteUploadRequest
      description: Finish an upload session, optionally asserting the content hash.
    CreateJobRequest:
      properties:
        files:
          items:
            $ref: '#/components/schemas/JobFileEntry'
          type: array
          maxItems: 100
          minItems: 1
          title: Files
          description: 要解析的文档，按顺序。
        tier:
          anyOf:
          - type: string
            enum:
            - flash
            - basic
            - standard
            - advanced
          - type: 'null'
          title: Tier
          description: 质量档位：flash、basic、standard 或 advanced。省略则使用服务端默认值。
          examples:
          - standard
        ocr_mode:
          type: string
          enum:
          - auto
          - txt
          - ocr
          title: Ocr Mode
          description: 本次解析任务的 OCR 模式：自动判断、使用文本层，或强制 OCR。
          default: auto
          examples:
          - auto
        output_formats:
          items:
            type: string
          type: array
          title: Output Formats
          description: 要产出的产物：markdown、middle_json、structured_content、zip。
          default:
          - markdown
          examples:
          - - markdown
            - middle_json
        callback:
          anyOf:
          - $ref: '#/components/schemas/CallbackConfig'
          - type: 'null'
          description: 任务完成时调用的 Webhook；本地服务会拒绝。
      additionalProperties: false
      type: object
      required:
      - files
      title: CreateJobRequest
      description: Submit documents for parsing.
    CreateUploadRequest:
      properties:
        filename:
          type: string
          minLength: 1
          title: Filename
          description: 文件名，用于创建 File 对象。
        bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Bytes
          description: 将要上传的内容的精确大小。
        mime_type:
          type: string
          minLength: 1
          title: Mime Type
          description: 文件的内容类型，例如 application/pdf。
        purpose:
          type: string
          enum:
          - parse
          - input_image
          title: Purpose
          description: 文件用途：解析文档，或图片输入。
          default: parse
        sha256sum:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          title: Sha256Sum
          description: 内容的小写十六进制 SHA-256；可让服务端复用相同的上传。
        expires_after:
          anyOf:
          - $ref: '#/components/schemas/ExpiresAfter'
          - type: 'null'
          description: 上传的保留时长；省略时使用服务端默认值。
      additionalProperties: false
      type: object
      required:
      - filename
      - bytes
      - mime_type
      title: CreateUploadRequest
      description: Open an upload session before sending the bytes.
    ErrorDetail:
      properties:
        type:
          type: string
          title: Type
          description: 错误类别，例如 invalid_request_error、permission_error、engine_error。
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
          description: 稳定的机器可读错误码，例如 file_not_found。
        message:
          type: string
          title: Message
          description: 人类可读的错误描述。
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
          description: 错误涉及的请求字段（存在时）。
      additionalProperties: false
      type: object
      required:
      - type
      - message
      title: ErrorDetail
      description: One structured error, shared by every V1 endpoint.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
          description: 发生的错误。
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      description: The envelope every error response uses.
    ExpiresAfter:
      properties:
        anchor:
          type: string
          const: created_at
          title: Anchor
          description: 过期时间的起算时间。
          default: created_at
        seconds:
          type: integer
          maximum: 2592000.0
          minimum: 3600.0
          title: Seconds
          description: 存活秒数（1 小时到 30 天）。
          default: 3600
      additionalProperties: false
      type: object
      title: ExpiresAfter
      description: When the created resource should expire.
    FileDeletionResponse:
      properties:
        id:
          type: string
          title: Id
          description: 被删除的文件 ID。
        object:
          type: string
          const: file
          title: Object
          description: 对象类型；恒为 "file"。
          default: file
        deleted:
          type: boolean
          title: Deleted
          description: 删除成功时恒为 true。
          default: true
      additionalProperties: false
      type: object
      required:
      - id
      title: FileDeletionResponse
      description: Confirmation that a file was deleted.
    FileIdSource:
      properties:
        type:
          type: string
          const: file_id
          title: Type
          description: 选择 file_id 来源变体。
          default: file_id
        file_id:
          type: string
          title: File Id
          description: 已完成上传的 File 对象 ID。
      additionalProperties: false
      type: object
      required:
      - file_id
      title: FileIdSource
      description: Reference bytes that were uploaded earlier.
    FileListResponse:
      properties:
        object:
          type: string
          const: list
          title: Object
          description: 对象类型；恒为 "list"。
          default: list
        data:
          items:
            $ref: '#/components/schemas/FileObjectModel'
          type: array
          title: Data
          description: 本页的文件。
        first_id:
          anyOf:
          - type: string
          - type: 'null'
          title: First Id
          description: 本页第一项的 ID。
        last_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Id
          description: 本页最后一项的 ID；下一页作为 `after` 传入。
        has_more:
          type: boolean
          title: Has More
          description: 是否还有下一页。
          default: false
      additionalProperties: false
      type: object
      required:
      - data
      title: FileListResponse
      description: One page of files.
    FileObjectModel:
      properties:
        id:
          type: string
          title: Id
          description: 文件 ID，提交任务或下载内容时使用。
        object:
          type: string
          const: file
          title: Object
          description: 对象类型；恒为 "file"。
          default: file
        bytes:
          type: integer
          title: Bytes
          description: 已存储内容的大小。
        created_at:
          type: integer
          title: Created At
          description: 文件创建的 Unix 时间戳。
        expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires At
          description: 文件失效的 Unix 时间戳；null 表示长期保留。
        filename:
          type: string
          title: Filename
          description: 文件名。
        purpose:
          type: string
          enum:
          - parse
          - parse_output
          - input_image
          title: Purpose
          description: 文件用途：解析源文件、解析产物，或图片输入。
        sha256sum:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256Sum
          description: 内容哈希（服务端已记录时）。
      additionalProperties: false
      type: object
      required:
      - id
      - bytes
      - created_at
      - filename
      - purpose
      title: FileObjectModel
      description: A file resource (source or parse output).
