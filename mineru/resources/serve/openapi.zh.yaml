  /v1/tasks:
    post:
      tags:
      - Tasks
      summary: 创建任务
      description: 提交任务后立即返回公共 ID；缓存命中时不读取请求主体。
      operationId: create_task_v1_tasks_post
      security:
      - HTTPBearer: []
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
      requestBody:
        required: true
        description: 要解析的文档。三种方式任选：带 `files` 字段的 multipart/form-data；单个原始文件用 application/octet-stream（配合查询参数）；或带 CreateJobRequest
          主体的 application/json。
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                  description: One or more documents to parse, in order.
          application/json:
            schema:
              additionalProperties: false
              description: Submit documents for parsing.
              properties:
                files:
                  description: Documents to parse, in order.
                  items:
                    additionalProperties: false
                    description: One document to parse, with an optional page selection.
                    properties:
                      source:
                        description: Where the document comes from; `type` selects the source variant.
                        discriminator:
                          propertyName: type
                        oneOf:
                        - additionalProperties: false
                          description: Reference bytes that were uploaded earlier.
                          properties:
                            type:
                              const: file_id
                              default: file_id
                              description: Selects the file_id source variant.
                              title: Type
                              type: string
                            file_id:
                              description: ID of a completed upload's File object.
                              title: File Id
                              type: string
                          required:
                          - file_id
                          title: FileIdSource
                          type: object
                        - additionalProperties: false
                          description: Let the server fetch the document itself.
                          properties:
                            type:
                              const: url
                              default: url
                              description: Selects the url source variant.
                              title: Type
                              type: string
                            url:
                              description: HTTP(S) URL the server downloads before parsing.
                              title: Url
                              type: string
                          required:
                          - url
                          title: UrlSource
                          type: object
                        - additionalProperties: false
                          description: Carry the document in the request body as base64.
                          properties:
                            type:
                              const: inline
                              default: inline
                              description: Selects the inline source variant.
                              title: Type
                              type: string
                            name:
                              description: File name for the inline content; the suffix selects the parser.
                              minLength: 1
                              title: Name
                              type: string
                            data:
                              description: Base64-encoded file content.
                              minLength: 1
                              title: Data
                              type: string
                          required:
                          - name
                          - data
                          title: InlineSource
                          type: object
                        - additionalProperties: false
                          description: Read a path on the server's own filesystem.
                          properties:
                            type:
                              const: local
                              default: local
                              description: Selects the local source variant.
                              title: Type
                              type: string
                            path:
                              description: Path on the server; only accepted when local sources are enabled.
                              minLength: 1
                              title: Path
                              type: string
                          required:
                          - path
                          title: LocalSource
                          type: object
                        title: Source
                      page_range:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: 'PDF page selection: 1-based inclusive ranges, e.g. ''1-5,8,r3-r1''; ''r1'' is the last
                          page and ''all'' selects every page. Blank means unspecified. Selections are sorted and deduplicated;
                          out-of-bounds pages are omitted. Reversed ranges, ''~'' and negative page numbers are invalid.'
                        examples:
                        - 1-5,8,r3-r1
                        - all
                        title: Page Range
                    required:
                    - source
                    title: JobFileEntry
                    type: object
                  maxItems: 100
                  minItems: 1
                  title: Files
                  type: array
                tier:
                  anyOf:
                  - enum:
                    - flash
                    - basic
                    - standard
                    - advanced
                    type: string
                  - type: 'null'
                  description: 'Quality tier: flash, basic, standard or advanced. Omit to use the server''s default.'
                  examples:
                  - standard
                  title: Tier
                ocr_mode:
                  default: auto
                  description: 'OCR mode for this parse job: auto-detect, native text, or forced OCR.'
                  enum:
                  - auto
                  - txt
                  - ocr
                  examples:
                  - auto
                  title: Ocr Mode
                  type: string
                output_formats:
                  default:
                  - markdown
                  description: 'Artifacts to produce: markdown, middle_json, structured_content, zip.'
                  examples:
                  - - markdown
                    - middle_json
                  items:
                    type: string
                  title: Output Formats
                  type: array
                callback:
                  anyOf:
                  - additionalProperties: false
                    description: Where to deliver a webhook when the job reaches a terminal state.
                    properties:
                      url:
                        description: HTTP(S) URL the server posts the finished job to.
                        title: Url
                        type: string
                      secret:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Shared secret used to sign the callback.
                        title: Secret
                    required:
                    - url
                    title: CallbackConfig
                    type: object
                  - type: 'null'
                  description: Webhook to call when the job finishes; local servers reject it.
              required:
              - files
              title: CreateJobRequest
              type: object
          application/octet-stream:
            schema:
              type: string
              format: binary
            description: Raw file bytes; `filename` is required as a query parameter.
      parameters:
      - name: tier
        in: query
        required: false
        description: 质量档位：flash、basic、standard 或 advanced。省略则使用服务端默认值。
        schema:
          anyOf:
          - enum:
            - flash
            - basic
            - standard
            - advanced
            type: string
          - type: 'null'
          examples:
          - standard
          title: Tier
      - name: ocr_mode
        in: query
        required: false
        description: OCR 模式：自动判断、仅用文本层，或强制 OCR。
        schema:
          default: auto
          enum:
          - auto
          - txt
          - ocr
          examples:
          - auto
          title: Ocr Mode
          type: string
      - name: page_range
        in: query
        required: false
        description: PDF 页码选择：1 起始的闭区间，例如 '1-5,8,r3-r1'；'r1' 表示最后一页，'all' 表示全部页面。留空表示不指定。选择会排序去重，越界页会被忽略。反向区间、'~' 与负数页码无效。
        schema:
          default: ''
          examples:
          - 1-5,8,r3-r1
          - all
          title: Page Range
          type: string
      - name: output_formats
        in: query
        required: false
        description: 要产出的产物：markdown、middle_json、structured_content、zip。
        schema:
          examples:
          - - markdown
            - structured_content
          items:
            type: string
          title: Output Formats
          type: array
      - name: filename
        in: query
        required: false
        description: 仅原始字节上传：文件名，其后缀决定使用哪个解析器。
        schema:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          examples:
          - document.pdf
          title: Filename
      - name: sha256sum
        in: query
        required: false
        description: 仅原始字节上传：小写十六进制 SHA-256，相同的字节可被复用。
        schema:
          anyOf:
          - pattern: ^[a-f0-9]{64}$
            type: string
          - type: 'null'
          examples:
          - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          title: Sha256Sum
      - name: Content-Length
        in: header
        required: false
        description: application/octet-stream 必填；必须与实际文件字节数一致。
        schema:
          type: integer
          minimum: 1
          maximum: 209715200
          examples:
          - 1048576
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/tasks?tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content\"\
          \nheaders = {\n    \"Authorization\": \"Bearer YOUR_TOKEN\",\n}\nfiles = {\"files\": (\"document.pdf\", open(\"\
          document.pdf\", \"rb\"), \"application/pdf\")}\n\nresponse = requests.post(url, files=files, headers=headers)\n\n\
          print(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/tasks?tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content\"\
          ;\nconst form = new FormData();\nform.append(\"files\", fileInput.files[0], \"document.pdf\");\n\nconst response\
          \ = await fetch(url, {\n  method: \"POST\",\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n  body:\
          \ form,\n});\n\nconst data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X POST 'SERVER_URL/v1/tasks?tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content'\
          \ \\\n  -H \"Authorization: Bearer YOUR_TOKEN\" \\\n  -F \"files=@document.pdf\""
