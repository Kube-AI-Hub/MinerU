        source: "import requests\n\nurl = \"SERVER_URL/v1/tasks/{task_id}\"\nheaders = {\n    \"Authorization\": \"Bearer\
          \ YOUR_TOKEN\",\n}\nresponse = requests.delete(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/tasks/{task_id}\";\n\nconst response = await fetch(url, {\n  method: \"DELETE\"\
          ,\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await response.json();\nconsole.log(response.status,\
          \ data);"
      - lang: shell
        label: cURL
        source: "curl -X DELETE 'SERVER_URL/v1/tasks/{task_id}' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
  /v1/tasks/{task_id}/result:
    get:
      tags:
      - Tasks
      summary: Get Result
      description: Return inline JSON or the artifact archive, depending on the task's terminal state.
      operationId: get_result_v1_tasks__task_id__result_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          description: Task ID (job_...)
          examples:
          - job_1324359f69a657f22b833071
          title: Task Id
        description: Task ID (job_...)
      - name: response_format
        in: query
        required: false
        schema:
          enum:
          - json
          - zip
          type: string
          description: 'Result shape: "json" inlines the content, "zip" returns the artifact archive.'
          examples:
          - json
          default: json
          title: Response Format
        description: 'Result shape: "json" inlines the content, "zip" returns the artifact archive.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultResponse'
            application/zip:
              schema:
                type: string
                format: binary
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
          description: Accepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/tasks/{task_id}/result?response_format=json\"\nheaders = {\n   \
          \ \"Authorization\": \"Bearer YOUR_TOKEN\",\n}\nresponse = requests.get(url, headers=headers)\n\nprint(response.status_code)\n\
          print(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/tasks/{task_id}/result?response_format=json\";\n\nconst response = await fetch(url,\
          \ {\n  method: \"GET\",\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await\
          \ response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X GET 'SERVER_URL/v1/tasks/{task_id}/result?response_format=json' \\\n  -H \"Authorization: Bearer\
          \ YOUR_TOKEN\""
  /v1/file_parse:
    post:
      tags:
      - Tasks
      summary: File Parse
      description: Wrap the shared async task synchronously; a wait timeout does not cancel the work.
      operationId: file_parse_v1_file_parse_post
      security:
      - HTTPBearer: []
      parameters:
      - name: response_format
        in: query
        required: false
        schema:
          enum:
          - json
          - zip
          type: string
          description: 'Result shape: "json" inlines the content, "zip" returns the artifact archive.'
          examples:
          - json
          default: json
          title: Response Format
        description: 'Result shape: "json" inlines the content, "zip" returns the artifact archive.'
      - name: wait_timeout
        in: query
        required: false
        schema:
          type: integer
          maximum: 3600
          minimum: 1
          description: Seconds to wait for the job before returning its current status; the job keeps running.
          examples:
          - 300
          default: 300
          title: Wait Timeout
        description: Seconds to wait for the job before returning its current status; the job keeps running.
      - name: tier
        in: query
        required: false
        description: 'Quality tier: flash, basic, standard or advanced. Omit to use the server''s default.'
        schema:
          anyOf:
          - enum:
            - flash
            - basic
            - standard
            - advanced
            type: string
          - type: 'null'
          examples:
          - standard
          title: Tier
      - name: ocr_mode
        in: query
        required: false
        description: 'OCR mode: auto-detect, native text only, or forced OCR.'
        schema:
          default: auto
          enum:
          - auto
          - txt
          - ocr
          examples:
          - auto
          title: Ocr Mode
          type: string
      - name: page_range
        in: query
        required: false
        description: 'PDF page selection: 1-based inclusive ranges, e.g. ''1-5,8,r3-r1''; ''r1'' is the last page and ''all''
          selects every page. Blank means unspecified. Selections are sorted and deduplicated; out-of-bounds pages are omitted.
          Reversed ranges, ''~'' and negative page numbers are invalid.'
        schema:
          default: ''
          examples:
          - 1-5,8,r3-r1
          - all
          title: Page Range
          type: string
      - name: output_formats
        in: query
        required: false
        description: 'Artifacts to produce: markdown, middle_json, structured_content, zip.'
        schema:
          examples:
          - - markdown
            - structured_content
          items:
            type: string
          title: Output Formats
          type: array
      - name: filename
        in: query
        required: false
        description: 'Raw uploads only: file name, whose suffix selects the parser.'
        schema:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          examples:
          - document.pdf
          title: Filename
      - name: sha256sum
        in: query
        required: false
        description: 'Raw uploads only: lowercase hex SHA-256, so identical bytes can be reused.'
        schema:
          anyOf:
          - pattern: ^[a-f0-9]{64}$
            type: string
          - type: 'null'
          examples:
          - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          title: Sha256Sum
      - name: Content-Length
        in: header
        required: false
        description: Required for application/octet-stream; must match actual file bytes.
        schema:
          type: integer
          minimum: 1
          maximum: 209715200
          examples:
          - 1048576
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultResponse'
            application/zip:
              schema:
                type: string
                format: binary
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
          description: Accepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: 'The document to parse. Send one of: multipart/form-data with `files` fields, application/octet-stream
          for a single raw file (with query parameters), or application/json with a CreateJobRequest body.'
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                  description: One or more documents to parse, in order.
          application/json:
            schema:
              additionalProperties: false
              description: Submit documents for parsing.
              properties:
                files:
                  description: Documents to parse, in order.
                  items:
                    additionalProperties: false
                    description: One document to parse, with an optional page selection.
                    properties:
                      source:
                        description: Where the document comes from; `type` selects the source variant.
                        discriminator:
                          propertyName: type
                        oneOf:
                        - additionalProperties: false
                          description: Reference bytes that were uploaded earlier.
                          properties:
                            type:
                              const: file_id
                              default: file_id
                              description: Selects the file_id source variant.
                              title: Type
                              type: string
                            file_id:
                              description: ID of a completed upload's File object.
                              title: File Id
                              type: string
                          required:
                          - file_id
                          title: FileIdSource
                          type: object
                        - additionalProperties: false
                          description: Let the server fetch the document itself.
                          properties:
                            type:
                              const: url
                              default: url
                              description: Selects the url source variant.
                              title: Type
                              type: string
                            url:
                              description: HTTP(S) URL the server downloads before parsing.
                              title: Url
                              type: string
                          required:
                          - url
                          title: UrlSource
                          type: object
                        - additionalProperties: false
                          description: Carry the document in the request body as base64.
                          properties:
                            type:
                              const: inline
                              default: inline
                              description: Selects the inline source variant.
                              title: Type
                              type: string
                            name:
                              description: File name for the inline content; the suffix selects the parser.
                              minLength: 1
                              title: Name
                              type: string
                            data:
                              description: Base64-encoded file content.
                              minLength: 1
                              title: Data
                              type: string
                          required:
                          - name
                          - data
                          title: InlineSource
                          type: object
                        - additionalProperties: false
                          description: Read a path on the server's own filesystem.
                          properties:
                            type:
                              const: local
                              default: local
                              description: Selects the local source variant.
                              title: Type
                              type: string
                            path:
                              description: Path on the server; only accepted when local sources are enabled.
                              minLength: 1
                              title: Path
                              type: string
                          required:
                          - path
                          title: LocalSource
                          type: object
                        title: Source
                      page_range:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: 'PDF page selection: 1-based inclusive ranges, e.g. ''1-5,8,r3-r1''; ''r1'' is the last
                          page and ''all'' selects every page. Blank means unspecified. Selections are sorted and deduplicated;
                          out-of-bounds pages are omitted. Reversed ranges, ''~'' and negative page numbers are invalid.'
                        examples:
                        - 1-5,8,r3-r1
                        - all
                        title: Page Range
                    required:
                    - source
                    title: JobFileEntry
                    type: object
                  maxItems: 100
                  minItems: 1
                  title: Files
                  type: array
                tier:
                  anyOf:
                  - enum:
                    - flash
                    - basic
                    - standard
                    - advanced
                    type: string
                  - type: 'null'
                  description: 'Quality tier: flash, basic, standard or advanced. Omit to use the server''s default.'
                  examples:
                  - standard
                  title: Tier
                ocr_mode:
                  default: auto
                  description: 'OCR mode for this parse job: auto-detect, native text, or forced OCR.'
                  enum:
                  - auto
                  - txt
                  - ocr
                  examples:
                  - auto
                  title: Ocr Mode
                  type: string
                output_formats:
                  default:
                  - markdown
                  description: 'Artifacts to produce: markdown, middle_json, structured_content, zip.'
                  examples:
                  - - markdown
                    - middle_json
                  items:
                    type: string
                  title: Output Formats
                  type: array
                callback:
                  anyOf:
                  - additionalProperties: false
                    description: Where to deliver a webhook when the job reaches a terminal state.
                    properties:
                      url:
                        description: HTTP(S) URL the server posts the finished job to.
                        title: Url
                        type: string
                      secret:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Shared secret used to sign the callback.
                        title: Secret
                    required:
                    - url
                    title: CallbackConfig
                    type: object
                  - type: 'null'
                  description: Webhook to call when the job finishes; local servers reject it.
              required:
              - files
              title: CreateJobRequest
              type: object
          application/octet-stream:
            schema:
              type: string
              format: binary
            description: Raw file bytes; `filename` is required as a query parameter.
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/file_parse?response_format=json&wait_timeout=300&tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content\"\
          \nheaders = {\n    \"Authorization\": \"Bearer YOUR_TOKEN\",\n}\nfiles = {\"files\": (\"document.pdf\", open(\"\
          document.pdf\", \"rb\"), \"application/pdf\")}\n\nresponse = requests.post(url, files=files, headers=headers)\n\n\
          print(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/file_parse?response_format=json&wait_timeout=300&tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content\"\
          ;\nconst form = new FormData();\nform.append(\"files\", fileInput.files[0], \"document.pdf\");\n\nconst response\
          \ = await fetch(url, {\n  method: \"POST\",\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n  body:\
          \ form,\n});\n\nconst data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X POST 'SERVER_URL/v1/file_parse?response_format=json&wait_timeout=300&tier=standard&ocr_mode=auto&page_range=1-5%2C8%2Cr3-r1&output_formats=markdown&output_formats=structured_content'\
          \ \\\n  -H \"Authorization: Bearer YOUR_TOKEN\" \\\n  -F \"files=@document.pdf\""
components:
  schemas:
    CallbackConfig:
      properties:
        url:
          type: string
          title: Url
          description: HTTP(S) URL the server posts the finished job to.
        secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret
          description: Shared secret used to sign the callback.
      additionalProperties: false
      type: object
      required:
      - url
      title: CallbackConfig
      description: Where to deliver a webhook when the job reaches a terminal state.
    CompleteUploadRequest:
      properties:
        sha256sum:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          title: Sha256Sum
          description: Lowercase hex SHA-256 of the uploaded bytes; a mismatch rejects the upload.
      additionalProperties: false
      type: object
      title: CompleteUploadRequest
      description: Finish an upload session, optionally asserting the content hash.
    CreateJobRequest:
      properties:
        files:
          items:
            $ref: '#/components/schemas/JobFileEntry'
          type: array
          maxItems: 100
          minItems: 1
          title: Files
          description: Documents to parse, in order.
        tier:
          anyOf:
          - type: string
            enum:
            - flash
            - basic
            - standard
            - advanced
          - type: 'null'
          title: Tier
          description: 'Quality tier: flash, basic, standard or advanced. Omit to use the server''s default.'
          examples:
          - standard
        ocr_mode:
          type: string
          enum:
          - auto
          - txt
          - ocr
          title: Ocr Mode
          description: 'OCR mode for this parse job: auto-detect, native text, or forced OCR.'
          default: auto
          examples:
          - auto
        output_formats:
          items:
            type: string
          type: array
          title: Output Formats
          description: 'Artifacts to produce: markdown, middle_json, structured_content, zip.'
          default:
          - markdown
          examples:
          - - markdown
            - middle_json
        callback:
          anyOf:
          - $ref: '#/components/schemas/CallbackConfig'
          - type: 'null'
          description: Webhook to call when the job finishes; local servers reject it.
      additionalProperties: false
      type: object
      required:
      - files
      title: CreateJobRequest
      description: Submit documents for parsing.
    CreateUploadRequest:
      properties:
        filename:
          type: string
          minLength: 1
          title: Filename
          description: File name, used for the created File object.
        bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Bytes
          description: Exact size of the content that will be uploaded.
        mime_type:
          type: string
          minLength: 1
          title: Mime Type
          description: Content type of the file, e.g. application/pdf.
        purpose:
          type: string
          enum:
          - parse
          - input_image
          title: Purpose
          description: 'What the file is for: parsing a document, or an image input.'
          default: parse
        sha256sum:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          title: Sha256Sum
          description: Lowercase hex SHA-256 of the content; lets the server reuse an identical upload.
        expires_after:
          anyOf:
          - $ref: '#/components/schemas/ExpiresAfter'
          - type: 'null'
          description: Retention for the upload; server default applies when omitted.
      additionalProperties: false
      type: object
      required:
      - filename
      - bytes
      - mime_type
      title: CreateUploadRequest
      description: Open an upload session before sending the bytes.
    ErrorDetail:
      properties:
        type:
          type: string
          title: Type
          description: Error class, e.g. invalid_request_error, permission_error, engine_error.
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
          description: Stable machine-readable code, e.g. file_not_found.
        message:
          type: string
          title: Message
          description: Human-readable description of what went wrong.
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
          description: Request field the error refers to, when there is one.
      additionalProperties: false
      type: object
      required:
      - type
      - message
      title: ErrorDetail
      description: One structured error, shared by every V1 endpoint.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
          description: The error that occurred.
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      description: The envelope every error response uses.
    ExpiresAfter:
      properties:
        anchor:
          type: string
          const: created_at
          title: Anchor
          description: Timestamp the expiry counts from.
          default: created_at
        seconds:
          type: integer
          maximum: 2592000.0
          minimum: 3600.0
          title: Seconds
          description: Lifetime in seconds (1 hour to 30 days).
          default: 3600
      additionalProperties: false
      type: object
      title: ExpiresAfter
      description: When the created resource should expire.
    FileDeletionResponse:
      properties:
        id:
          type: string
          title: Id
          description: File ID that was deleted.
        object:
          type: string
          const: file
          title: Object
          description: Object type; always "file".
          default: file
        deleted:
          type: boolean
          title: Deleted
          description: Always true on a successful delete.
          default: true
      additionalProperties: false
      type: object
      required:
      - id
      title: FileDeletionResponse
      description: Confirmation that a file was deleted.
    FileIdSource:
      properties:
        type:
          type: string
          const: file_id
          title: Type
          description: Selects the file_id source variant.
          default: file_id
        file_id:
          type: string
          title: File Id
          description: ID of a completed upload's File object.
      additionalProperties: false
      type: object
      required:
      - file_id
      title: FileIdSource
      description: Reference bytes that were uploaded earlier.
    FileListResponse:
      properties:
        object:
          type: string
          const: list
          title: Object
          description: Object type; always "list".
          default: list
        data:
          items:
            $ref: '#/components/schemas/FileObjectModel'
          type: array
          title: Data
          description: Files on this page.
        first_id:
          anyOf:
          - type: string
          - type: 'null'
          title: First Id
          description: ID of the first item on this page.
        last_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Id
          description: ID of the last item; pass it as `after` for the next page.
        has_more:
          type: boolean
          title: Has More
          description: Whether another page is available.
          default: false
      additionalProperties: false
      type: object
      required:
      - data
      title: FileListResponse
      description: One page of files.
    FileObjectModel:
      properties:
        id:
          type: string
          title: Id
          description: File ID, used when submitting a job or downloading content.
        object:
          type: string
          const: file
          title: Object
          description: Object type; always "file".
          default: file
        bytes:
          type: integer
          title: Bytes
          description: Size of the stored content.
        created_at:
          type: integer
          title: Created At
          description: Unix timestamp when the file was created.
        expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires At
          description: Unix timestamp after which the file is gone; null keeps it.
        filename:
          type: string
          title: Filename
          description: File name.
        purpose:
          type: string
          enum:
          - parse
          - parse_output
          - input_image
          title: Purpose
          description: 'What the file is for: parse source, parse output, or image input.'
        sha256sum:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256Sum
          description: Content hash, when the server recorded one.
      additionalProperties: false
      type: object
      required:
      - id
      - bytes
      - created_at
      - filename
      - purpose
      title: FileObjectModel
      description: A file resource (source or parse output).
    FileParseInfo:
      properties:
        model_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Used
          description: Model that parsed the file, when one is recorded.
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
          description: Parsing time in milliseconds.
        parser_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Parser Version
          description: Engine version that parsed the file.
      additionalProperties: false
      type: object
      title: FileParseInfo
      description: How one file was parsed.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthFeatures:
      properties:
        webhook:
          type: boolean
          title: Webhook
          description: Whether webhook callbacks are accepted.
          default: false
        output_formats:
          items:
            type: string
            enum:
            - markdown
            - middle_json
            - structured_content
            - html
            - latex
            - docx
            - zip
          type: array
          title: Output Formats
          description: Output formats this server produces for a parse job.
        sources:
          items:
            type: string
            enum:
            - file_id
            - url
            - inline
            - local
          type: array
          title: Sources
          description: Source types accepted by this server.
      additionalProperties: false
      type: object
      title: HealthFeatures
      description: What this server instance can do, so a client can plan before submitting.
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Always "ok" when the server is ready to parse.
          default: ok
        version:
          type: string
          title: Version
          description: Engine version serving this request.
        features:
          $ref: '#/components/schemas/HealthFeatures'
          description: Capabilities of this instance.
      additionalProperties: false
      type: object
      required:
      - version
      title: HealthResponse
      description: Liveness and capability report.
    InlineSource:
      properties:
        type:
          type: string
          const: inline
          title: Type
          description: Selects the inline source variant.
          default: inline
        name:
          type: string
          minLength: 1
          title: Name
          description: File name for the inline content; the suffix selects the parser.
        data:
          type: string
          minLength: 1
          title: Data
          description: Base64-encoded file content.
      additionalProperties: false
      type: object
      required:
      - name
      - data
      title: InlineSource
      description: Carry the document in the request body as base64.
    JobAsyncResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Job ID, used to poll, cancel and fetch results.
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - partial
          - failed
          - canceled
          title: Status
          description: 'Job state: queued, running, completed, partial, failed or canceled.'
        created_at:
          type: string
          title: Created At
          description: ISO-8601 UTC timestamp when the job was submitted.
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
