    post:
      tags:
      - Tasks
      summary: Create Task
      description: Submit the job and return its public ID immediately; a cache hit skips reading the body.
      operationId: create_task_v1_tasks_post
      security:
      - HTTPBearer: []
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
      requestBody:
        required: true
        description: 'The document to parse. Send one of: multipart/form-data with `files` fields, application/octet-stream
          for a single raw file (with query parameters), or application/json with a CreateJobRequest body.'
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                  description: One or more documents to parse, in order.
          application/json:
            schema:
              additionalProperties: false
              description: Submit documents for parsing.
              properties:
                files:
                  description: Documents to parse, in order.
                  items:
                    additionalProperties: false
                    description: One document to parse, with an optional page selection.
                    properties:
                      source:
                        description: Where the document comes from; `type` selects the source variant.
                        discriminator:
                          propertyName: type
                        oneOf:
                        - additionalProperties: false
                          description: Reference bytes that were uploaded earlier.
                          properties:
                            type:
                              const: file_id
                              default: file_id
                              description: Selects the file_id source variant.
                              title: Type
                              type: string
                            file_id:
                              description: ID of a completed upload's File object.
                              title: File Id
                              type: string
                          required:
                          - file_id
                          title: FileIdSource
                          type: object
                        - additionalProperties: false
                          description: Let the server fetch the document itself.
                          properties:
                            type:
                              const: url
                              default: url
                              description: Selects the url source variant.
                              title: Type
                              type: string
                            url:
                              description: HTTP(S) URL the server downloads before parsing.
                              title: Url
                              type: string
                          required:
                          - url
                          title: UrlSource
                          type: object
                        - additionalProperties: false
                          description: Carry the document in the request body as base64.
                          properties:
                            type:
                              const: inline
                              default: inline
                              description: Selects the inline source variant.
                              title: Type
                              type: string
                            name:
                              description: File name for the inline content; the suffix selects the parser.
                              minLength: 1
                              title: Name
                              type: string
                            data:
                              description: Base64-encoded file content.
                              minLength: 1
                              title: Data
                              type: string
                          required:
                          - name
                          - data
                          title: InlineSource
                          type: object
                        - additionalProperties: false
                          description: Read a path on the server's own filesystem.
                          properties:
                            type:
                              const: local
                              default: local
                              description: Selects the local source variant.
                              title: Type
                              type: string
                            path:
                              description: Path on the server; only accepted when local sources are enabled.
                              minLength: 1
                              title: Path
                              type: string
                          required:
                          - path
                          title: LocalSource
                          type: object
                        title: Source
                      page_range:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: 'PDF page selection: 1-based inclusive ranges, e.g. ''1-5,8,r3-r1''; ''r1'' is the last
                          page and ''all'' selects every page. Blank means unspecified. Selections are sorted and deduplicated;
                          out-of-bounds pages are omitted. Reversed ranges, ''~'' and negative page numbers are invalid.'
                        examples:
                        - 1-5,8,r3-r1
                        - all
                        title: Page Range
                    required:
                    - source
                    title: JobFileEntry
                    type: object
                  maxItems: 100
                  minItems: 1
                  title: Files
                  type: array
                tier:
                  anyOf:
                  - enum:
                    - flash
                    - basic
                    - standard
                    - advanced
                    type: string
                  - type: 'null'
                  description: 'Quality tier: flash, basic, standard or advanced. Omit to use the server''s default.'
                  examples:
                  - standard
                  title: Tier
                ocr_mode:
                  default: auto
                  description: 'OCR mode for this parse job: auto-detect, native text, or forced OCR.'
                  enum:
                  - auto
                  - txt
                  - ocr
                  examples:
                  - auto
                  title: Ocr Mode
                  type: string
                output_formats:
                  default:
                  - markdown
                  description: 'Artifacts to produce: markdown, middle_json, structured_content, zip.'
                  examples:
                  - - markdown
                    - middle_json
                  items:
                    type: string
                  title: Output Formats
                  type: array
                callback:
                  anyOf:
                  - additionalProperties: false
                    description: Where to deliver a webhook when the job reaches a terminal state.
                    properties:
                      url:
                        description: HTTP(S) URL the server posts the finished job to.
                        title: Url
                        type: string
                      secret:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Shared secret used to sign the callback.
                        title: Secret
                    required:
                    - url
                    title: CallbackConfig
                    type: object
                  - type: 'null'
                  description: Webhook to call when the job finishes; local servers reject it.
              required:
              - files
              title: CreateJobRequest
              type: object
          application/octet-stream:
            schema:
              type: string
              format: binary
            description: Raw file bytes; `filename` is required as a query parameter.
      parameters:
      - name: tier
        in: query
        required: false
        description: 'Quality tier: flash, basic, standard or advanced. Omit to use the server''s default.'
        schema:
          anyOf:
          - enum:
            - flash
            - basic
            - standard
            - advanced
            type: string
          - type: 'null'
          examples:
          - standard
          title: Tier
      - name: ocr_mode
        in: query
        required: false
        description: 'OCR mode: auto-detect, native text only, or forced OCR.'
        schema:
          default: auto
          enum:
          - auto
          - txt
          - ocr
          examples:
          - auto
          title: Ocr Mode
          type: string
      - name: page_range
        in: query
        required: false
        description: 'PDF page selection: 1-based inclusive ranges, e.g. ''1-5,8,r3-r1''; ''r1'' is the last page and ''all''
          selects every page. Blank means unspecified. Selections are sorted and deduplicated; out-of-bounds pages are omitted.
          Reversed ranges, ''~'' and negative page numbers are invalid.'
        schema:
          default: ''
          examples:
          - 1-5,8,r3-r1
          - all
          title: Page Range
          type: string
      - name: output_formats
        in: query
        required: false
        description: 'Artifacts to produce: markdown, middle_json, structured_content, zip.'
        schema:
          examples:
          - - markdown
            - structured_content
          items:
            type: string
          title: Output Formats
          type: array
      - name: filename
        in: query
        required: false
        description: 'Raw uploads only: file name, whose suffix selects the parser.'
        schema:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          examples:
