openapi: 3.1.0
info:
  title: MinerU API
  version: 1.0.0
paths:
  /v1/health:
    get:
      tags:
      - Health
      summary: Get Health
      description: Report readiness and what this server can do.
      operationId: get_health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "SERVER_URL/v1/health"

          response = requests.get(url)


          print(response.status_code)

          print(response.json())'
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/health\";\n\nconst response = await fetch(url, {\n  method: \"GET\",\n});\n\n\
          const data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: curl -X GET 'SERVER_URL/v1/health'
  /v1/models:
    get:
      tags:
      - Models
      summary: List Models
      description: List the model IDs this server accepts.
      operationId: list_models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "SERVER_URL/v1/models"

          response = requests.get(url)


          print(response.status_code)

          print(response.json())'
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/models\";\n\nconst response = await fetch(url, {\n  method: \"GET\",\n});\n\n\
          const data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: curl -X GET 'SERVER_URL/v1/models'
  /v1/models/{model}:
    get:
      tags:
      - Models
      summary: Get Model
      description: Retrieve one advertised model by ID.
      operationId: get_model_v1_models__model__get
      security: []
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
          description: Model ID
          examples:
          - mineru-4.0.12
          title: Model
        description: Model ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "SERVER_URL/v1/models/{model}"

          response = requests.get(url)


          print(response.status_code)

          print(response.json())'
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/models/{model}\";\n\nconst response = await fetch(url, {\n  method: \"GET\",\n\
          });\n\nconst data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: curl -X GET 'SERVER_URL/v1/models/{model}'
  /v1/tiers:
    get:
      tags:
      - Tiers
      summary: List Tiers
      description: List the tiers this server can serve.
      operationId: list_tiers_v1_tiers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierListResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      x-code-samples:
      - lang: python
        label: Python
        source: 'import requests


          url = "SERVER_URL/v1/tiers"

          response = requests.get(url)


          print(response.status_code)

          print(response.json())'
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/tiers\";\n\nconst response = await fetch(url, {\n  method: \"GET\",\n});\n\n\
          const data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: curl -X GET 'SERVER_URL/v1/tiers'
  /v1/uploads:
    post:
      tags:
      - Uploads
      summary: Create Upload
      description: Open an upload session, then PUT the bytes to the returned URL.
      operationId: create_upload_v1_uploads_post
      requestBody:
        description: Declares the file to upload; the bytes follow in a separate PUT.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/uploads\"\nheaders = {\n    \"Authorization\": \"Bearer YOUR_TOKEN\"\
          ,\n}\npayload = {\n    \"filename\": \"string\",\n    \"bytes\": 0,\n    \"mime_type\": \"string\",\n    \"purpose\"\
          : \"parse\",\n    \"sha256sum\": \"string\",\n    \"expires_after\": {\n        \"anchor\": \"created_at\",\n  \
          \      \"seconds\": 3600\n    }\n}\n\nresponse = requests.post(url, json=payload, headers=headers)\n\nprint(response.status_code)\n\
          print(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/uploads\";\nconst payload = {\n  \"filename\": \"string\",\n  \"bytes\": 0,\n\
          \  \"mime_type\": \"string\",\n  \"purpose\": \"parse\",\n  \"sha256sum\": \"string\",\n  \"expires_after\": {\n\
          \    \"anchor\": \"created_at\",\n    \"seconds\": 3600\n  }\n};\n\nconst response = await fetch(url, {\n  method:\
          \ \"POST\",\n  headers: {\n    \"Content-Type\": \"application/json\",\n    Authorization: \"Bearer YOUR_TOKEN\"\
          ,\n  },\n  body: JSON.stringify(payload),\n});\n\nconst data = await response.json();\nconsole.log(response.status,\
          \ data);"
      - lang: shell
        label: cURL
        source: "curl -X POST 'SERVER_URL/v1/uploads' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\" \\\n  -H \"Content-Type:\
          \ application/json\" \\\n  -d '{\"filename\": \"string\", \"bytes\": 0, \"mime_type\": \"string\", \"purpose\":\
          \ \"parse\", \"sha256sum\": \"string\", \"expires_after\": {\"anchor\": \"created_at\", \"seconds\": 3600}}'"
  /v1/uploads/{upload_id}:
    get:
      tags:
      - Uploads
      summary: Get Upload
      description: Retrieve an Upload by ID.
      operationId: get_upload_v1_uploads__upload_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          description: Upload ID (upload_...)
          examples:
          - upload_3f9c2b1a
          title: Upload Id
        description: Upload ID (upload_...)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/uploads/{upload_id}\"\nheaders = {\n    \"Authorization\": \"Bearer\
          \ YOUR_TOKEN\",\n}\nresponse = requests.get(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/uploads/{upload_id}\";\n\nconst response = await fetch(url, {\n  method: \"GET\"\
          ,\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await response.json();\nconsole.log(response.status,\
          \ data);"
      - lang: shell
        label: cURL
        source: "curl -X GET 'SERVER_URL/v1/uploads/{upload_id}' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
  /v1/uploads/{upload_id}/content:
    put:
      tags:
      - Uploads
      summary: Upload Content
      description: Upload raw bytes for an upload (OpenAI-compatible).
      operationId: upload_content_v1_uploads__upload_id__content_put
      security:
      - HTTPBearer: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          description: Upload ID
          examples:
          - upload_3f9c2b1a
          title: Upload Id
        description: Upload ID
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              description: Raw file bytes for this upload session.
              title: Data
        description: Raw file bytes for this upload session.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Request Entity Too Large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/uploads/{upload_id}/content\"\nheaders = {\n    \"Authorization\"\
          : \"Bearer YOUR_TOKEN\",\n    \"Content-Type\": \"application/octet-stream\",\n}\nwith open(\"document.pdf\", \"\
          rb\") as source:\n    response = requests.put(url, data=source, headers=headers)\n\nprint(response.status_code)\n\
          print(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/uploads/{upload_id}/content\";\nconst file = document.querySelector('input[type=\"\
          file\"]').files[0];\n\nconst response = await fetch(url, {\n  method: \"PUT\",\n  headers: {\n    Authorization:\
          \ \"Bearer YOUR_TOKEN\",\n    \"Content-Type\": \"application/octet-stream\",\n  },\n  body: file,\n});\n\nconst\
          \ data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X PUT 'SERVER_URL/v1/uploads/{upload_id}/content' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\" \\\n\
          \  -H \"Content-Type: application/octet-stream\" \\\n  --data-binary @document.pdf"
  /v1/uploads/{upload_id}/complete:
    post:
      tags:
      - Uploads
      summary: Complete Upload
      description: Complete an upload, creating the File object.
      operationId: complete_upload_v1_uploads__upload_id__complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          description: Upload ID
          examples:
          - upload_3f9c2b1a
          title: Upload Id
        description: Upload ID
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CompleteUploadRequest'
              - type: 'null'
              title: Body
        required: false
        description: 'Optional: assert the uploaded content''s SHA-256 before the upload is finalized.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Request Entity Too Large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/uploads/{upload_id}/complete\"\nheaders = {\n    \"Authorization\"\
          : \"Bearer YOUR_TOKEN\",\n}\npayload = {\n    \"sha256sum\": \"string\"\n}\n\nresponse = requests.post(url, json=payload,\
          \ headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/uploads/{upload_id}/complete\";\nconst payload = {\n  \"sha256sum\": \"string\"\
          \n};\n\nconst response = await fetch(url, {\n  method: \"POST\",\n  headers: {\n    \"Content-Type\": \"application/json\"\
          ,\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n  body: JSON.stringify(payload),\n});\n\nconst data = await\
          \ response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X POST 'SERVER_URL/v1/uploads/{upload_id}/complete' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\" \\\
          \n  -H \"Content-Type: application/json\" \\\n  -d '{\"sha256sum\": \"string\"}'"
  /v1/uploads/{upload_id}/cancel:
    post:
      tags:
      - Uploads
      summary: Cancel Upload
      description: Cancel an in-progress upload.
      operationId: cancel_upload_v1_uploads__upload_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          description: Upload ID
          examples:
          - upload_3f9c2b1a
          title: Upload Id
        description: Upload ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/uploads/{upload_id}/cancel\"\nheaders = {\n    \"Authorization\"\
          : \"Bearer YOUR_TOKEN\",\n}\nresponse = requests.post(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/uploads/{upload_id}/cancel\";\n\nconst response = await fetch(url, {\n  method:\
          \ \"POST\",\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await response.json();\n\
          console.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X POST 'SERVER_URL/v1/uploads/{upload_id}/cancel' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
  /v1/files:
    get:
      tags:
      - Files
      summary: List Files
      description: List files for the current tenant.
      operationId: list_files_v1_files_get
      security:
      - HTTPBearer: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Cursor: last_id from previous page'
          examples:
          - file-0cf8b284ab9934cb7dfb68e0
          title: After
        description: 'Cursor: last_id from previous page'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Items per page
          examples:
          - 100
          default: 100
          title: Limit
        description: Items per page
      - name: order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          description: Sort by created_at
          examples:
          - desc
          default: desc
          title: Order
        description: Sort by created_at
      - name: purpose
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - parse
            - parse_output
            - input_image
            type: string
          - type: 'null'
          description: Only return files with this purpose
          examples:
          - parse_output
          title: Purpose
        description: Only return files with this purpose
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/files?after=file-0cf8b284ab9934cb7dfb68e0&limit=100&order=desc&purpose=parse_output\"\
          \nheaders = {\n    \"Authorization\": \"Bearer YOUR_TOKEN\",\n}\nresponse = requests.get(url, headers=headers)\n\
          \nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/files?after=file-0cf8b284ab9934cb7dfb68e0&limit=100&order=desc&purpose=parse_output\"\
          ;\n\nconst response = await fetch(url, {\n  method: \"GET\",\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\"\
          ,\n  },\n});\n\nconst data = await response.json();\nconsole.log(response.status, data);"
      - lang: shell
        label: cURL
        source: "curl -X GET 'SERVER_URL/v1/files?after=file-0cf8b284ab9934cb7dfb68e0&limit=100&order=desc&purpose=parse_output'\
          \ \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
  /v1/files/{file_id}:
    get:
      tags:
      - Files
      summary: Get File
      description: Retrieve file metadata.
      operationId: get_file_v1_files__file_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          description: File ID (file-...)
          examples:
          - file-0cf8b284ab9934cb7dfb68e0
          title: File Id
        description: File ID (file-...)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObjectModel'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/files/{file_id}\"\nheaders = {\n    \"Authorization\": \"Bearer\
          \ YOUR_TOKEN\",\n}\nresponse = requests.get(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/files/{file_id}\";\n\nconst response = await fetch(url, {\n  method: \"GET\"\
          ,\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await response.json();\nconsole.log(response.status,\
          \ data);"
      - lang: shell
        label: cURL
        source: "curl -X GET 'SERVER_URL/v1/files/{file_id}' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
    delete:
      tags:
      - Files
      summary: Delete File
      description: Delete a file from the current tenant view.
      operationId: delete_file_v1_files__file_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          description: File ID
          examples:
          - file-0cf8b284ab9934cb7dfb68e0
          title: File Id
        description: File ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDeletionResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-code-samples:
      - lang: python
        label: Python
        source: "import requests\n\nurl = \"SERVER_URL/v1/files/{file_id}\"\nheaders = {\n    \"Authorization\": \"Bearer\
          \ YOUR_TOKEN\",\n}\nresponse = requests.delete(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json())"
      - lang: javascript
        label: JavaScript
        source: "const url = \"SERVER_URL/v1/files/{file_id}\";\n\nconst response = await fetch(url, {\n  method: \"DELETE\"\
          ,\n  headers: {\n    Authorization: \"Bearer YOUR_TOKEN\",\n  },\n});\n\nconst data = await response.json();\nconsole.log(response.status,\
          \ data);"
      - lang: shell
        label: cURL
        source: "curl -X DELETE 'SERVER_URL/v1/files/{file_id}' \\\n  -H \"Authorization: Bearer YOUR_TOKEN\""
  /v1/files/{file_id}/content:
    get:
      tags:
      - Files
      summary: Get File Content
      description: Download parse-output content.
      operationId: get_file_content_v1_files__file_id__content_get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          description: File ID
          examples:
          - file-0cf8b284ab9934cb7dfb68e0
          title: File Id
        description: File ID
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema: {}
        '302':
          description: Redirect to CDN (cloud mode)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
