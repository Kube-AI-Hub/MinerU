tags:
- name: Tasks
  description: One-request parsing, asynchronous tasks and inline or ZIP results.
- name: Health
  description: Liveness and server readiness.
- name: Tiers
  description: Parsing tiers and runtime capability advertised by this server.
- name: Models
  description: VLM models available for parsing.
- name: Uploads
  description: Create and manage upload sessions for source documents.
- name: Files
  description: Inspect uploaded files and fetch parsed content.
- name: Jobs
  description: Submit parse jobs and poll for results.
- name: Usage
  description: Remote service quota and usage reporting.
servers:
- url: SERVER_URL
  description: API Server
