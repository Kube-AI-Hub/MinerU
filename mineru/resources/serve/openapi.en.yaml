      - name: sha256sum
        in: query
        required: false
        description: 'Raw uploads only: lowercase hex SHA-256, so identical bytes can be reused.'
        schema:
          anyOf:
          - pattern: ^[a-f0-9]{64}$
            type: string
          - type: 'null'
          examples:
