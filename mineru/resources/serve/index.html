<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinerU · 文档解析</title>
    <link rel="stylesheet" href="./index.css" />
    <script src="./i18n.js"></script>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <h1 data-i18n="title">MinerU 文档解析</h1>
        <p data-i18n="subtitle">
          把 PDF、Office 文档与图片转成带格式的 Markdown，并在浏览器里直接预览结果。
        </p>
      </header>

      <div class="card">
        <div class="tabs">
          <button class="tab active" data-target="test" data-i18n="tabTest">解析</button>
          <button class="tab" data-target="api" data-i18n="tabApi">API</button>
          <div class="tabs-right">
            <label class="token-control">
              <input type="checkbox" id="use-token" />
              <span data-i18n="useToken">使用我的访问令牌</span>
            </label>
          </div>
        </div>

        <section class="section active" id="section-test">
          <div class="workspace">
            <!-- 左：参数 -->
            <div class="pane controls">
              <label class="field">
                <span data-i18n="file">文档</span>
                <input type="file" id="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff" />
              </label>

              <div class="demos" id="demos" hidden>
                <span class="demos-label" data-i18n="demoLabel">或直接用内置示例：</span>
                <div class="demos-list" id="demos-list"></div>
              </div>

              <div class="tier-block">
                <div class="tier-head">
                  <span class="tier-name" id="tier-name">standard</span>
                  <span class="tier-notice" id="tier-notice"></span>
                </div>
                <input type="range" id="tier" min="0" max="3" step="1" value="2" class="tier-slider" />
                <div class="tier-ticks" id="tier-ticks"></div>
                <p class="muted" id="tier-desc"></p>
              </div>

              <label class="field">
                <span data-i18n="ocrMode">OCR 模式</span>
                <select id="ocr-mode">
                  <option value="auto" selected>auto</option>
                  <option value="txt">txt</option>
                  <option value="ocr">ocr</option>
                </select>
              </label>

              <label class="field">
                <span data-i18n="pageRange">页码范围</span>
                <input type="text" id="page-range" placeholder="all" />
                <span class="muted" data-i18n="pageRangeHint">留空或 all 表示全部页面。</span>
              </label>

              <div class="actions">
                <button class="primary" id="submit" data-i18n="parse">开始解析</button>
                <button class="ghost" id="clear" data-i18n="clear">清除</button>
              </div>
              <p class="status" id="status"></p>
            </div>

            <!-- 中：源文件预览 -->
            <div class="pane source-pane">
              <div class="pane-head">
                <span data-i18n="sourcePreview">源文档预览</span>
                <span class="muted" id="source-meta"></span>
              </div>
              <div class="source-body" id="source-body">
                <p class="muted placeholder" data-i18n="sourceEmpty">选择文件后，这里显示源文档。</p>
              </div>
              <p class="muted hint-line" data-i18n="sourceHint">
                移动鼠标到任一侧的标题、表格或段落，另一侧会同时高亮；点击可固定选中。
              </p>
            </div>

            <!-- 右：解析结果 -->
            <div class="pane result-pane">
              <div class="pane-head">
                <div class="result-tabs" id="result-tabs">
                  <button class="rtab active" data-view="markdown" data-i18n="viewMarkdown">Markdown</button>
                  <button class="rtab" data-view="json" data-i18n="viewJson">JSON</button>
                </div>
                <div class="download">
                  <button class="ghost" id="download-toggle" data-i18n="download">下载</button>
                  <div class="download-menu" id="download-menu" hidden></div>
                </div>
              </div>
              <div class="result" id="result">
                <p class="muted placeholder" data-i18n="resultEmpty">解析完成后，结果会显示在这里。</p>
              </div>
            </div>
          </div>
        </section>

        <section class="section" id="section-api">
          <rapi-doc
            id="rapidoc"
            render-style="read"
            theme="dark"
            bg-color="#14215a"
            text-color="#deebf6"
            header-color="#1f2c6a"
            primary-color="#a981f8"
            load-fonts="false"
            regular-font="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif"
            mono-font="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            show-header="false"
            layout="row"
            show-info="true"
            allow-try="true"
            allow-authentication="true"
            allow-spec-url-load="false"
            allow-spec-file-load="false"
            allow-server-selection="false"
            allow-api-list-style-selection="false"
            heading-text="MinerU API"
          ></rapi-doc>
        </section>
      </div>

      <footer class="footer">
        <span id="version"></span>
      </footer>
    </div>

    <script src="./rapidoc-min-9.3.8.js"></script>
  </body>
</html>
